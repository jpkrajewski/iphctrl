[project]
name = "iphctrl"
version = "0.1.0"
description = "Control iPhones over USB from Windows with pymobiledevice3 + WebDriverAgent"
readme = "README.md"
authors = [
    { name = "Jake", email = "jakubpkarajewski@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pymobiledevice3>=11.30.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
iphctrl = "iphctrl:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
]
